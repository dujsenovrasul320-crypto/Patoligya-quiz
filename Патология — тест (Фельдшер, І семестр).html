<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#e3e6ef;--pr:#4f46e5;--ok:#16a34a;--okb:#dcfce7;--er:#dc2626;--erb:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1220;--card:#1a1e33;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2c3250;--pr:#818cf8;--okb:#12351f;--erb:#3b1518}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1220;--card:#1a1e33;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2c3250;--pr:#818cf8;--okb:#12351f;--erb:#3b1518}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}p.s{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);text-align:left;margin-bottom:8px}
.btn.p{background:var(--pr);color:#fff;border-color:var(--pr);text-align:center;font-weight:600}
.btn small{display:block;color:var(--mu)} .btn.p small{color:#e0e7ff}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--pr);transition:width .2s}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px}

.o b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:.8rem}
.o.ok{border-color:var(--ok);background:var(--okb)}.o.no{border-color:var(--er);background:var(--erb)}

.big{font-size:3rem;font-weight:800;text-align:center;margin:8px 0}
.row{display:flex;gap:8px}.row .btn{text-align:center}
.mi{border-top:1px solid var(--bd);padding:10px 0}.mi:first-child{border:0}.mi .a{color:var(--ok)}.mi .x{color:var(--er)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bd);font-size:.85rem;margin-right:6px}

const $=h=>document.getElementById("app").innerHTML=h;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){
 const w=load();
 $(`<h1>🩺 Патология тесті</h1><p class="s">Фельдшер · І семестр · ${Q.length} сұрақ</p>
 <div class="card"><button class="btn p" onclick="start('all')">Барлық сұрақтар<small>${Q.length} сұрақ, араластырылған</small></button>
 <button class="btn" onclick="start('20')">Жылдам тест<small>кездейсоқ 20 сұрақ</small></button>
 <button class="btn" onclick="start('seq')">Ретімен өту<small>1-ден ${Q.length}-ге дейін</small></button>
 <button class="btn" onclick="start('wrong')" ${w.length?"":"disabled style='opacity:.5'"}>Қателерді қайталау<small>${w.length} сұрақ</small></button></div>
 <div class="card"><b>Диапазон бойынша</b><div class="row" style="margin:8px 0"><input id="a" type="number" min="1" max="${Q.length}" value="1" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)"><input id="b" type="number" min="1" max="${Q.length}" value="40" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)"></div>
 <button class="btn p" onclick="start('range')">Бастау</button></div>`)}
function start(m){
 let ids=Q.map((_,i)=>i);
 if(m=="all")ids=shuffle(ids);
 if(m=="20")ids=shuffle(ids).slice(0,20);
 if(m=="wrong")ids=shuffle(load().filter(i=>i<Q.length));
 if(m=="range"){const a=Math.max(1,+document.getElementById("a").value||1),b=Math.min(Q.length,+document.getElementById("b").value||Q.length);ids=ids.slice(a-1,b);ids=shuffle(ids)}
 if(!ids.length)return;
 S={ids,i:0,ok:0,bad:[],streak:0,best:0};show()}
function show(){
 const q=Q[S.ids[S.i]];
 const fixed=q.o.some(t=>/^[А-ДA-Dа-дa-d]\s*,/.test(t));
 let ord=q.o.map((_,i)=>i);if(!fixed)ord=shuffle(ord);
 cur={q,ord,done:false};
 const p=S.i/S.ids.length*100;
 $(`<div class="top"><span>${S.i+1} / ${S.ids.length}</span><span>✅ ${S.ok} · ❌ ${S.bad.length} · 🔥 ${S.streak}</span></div><div class="bar"><i style="width:${p}%"></i></div>
 <div class="card"><span class="chip">№${q.n}</span><p class="q" style="margin-top:10px">${esc(q.q)}</p>
 ${ord.map((k,j)=>`<button class="o" onclick="pick(${k})" id="o${k}"><b>${L[j]}</b><span>${esc(q.o[k])}</span></button>`).join("")}
 <div id="fb"></div></div><button class="btn" onclick="home()" style="text-align:center">Тоқтату</button>`)}
function pick(k){
 if(cur.done)return;cur.done=true;
 const c=KEY.charCodeAt(S.ids[S.i])-97,good=k===c;
 document.querySelectorAll(".o").forEach(b=>b.disabled=true);
 document.getElementById("o"+c).classList.add("ok");
 let w=load();
 if(good){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak);w=w.filter(i=>i!==S.ids[S.i])}
 else{document.getElementById("o"+k).classList.add("no");S.bad.push({id:S.ids[S.i],k});S.streak=0;if(!w.includes(S.ids[S.i]))w.push(S.ids[S.i])}
 save(w);
 document.getElementById("fb").innerHTML=`<div class="fb ${good?"ok":"no"}">${good?"✅ Дұрыс жауап!":"❌ Қате жауап"}</div><button class="btn p" onclick="next()">${S.i+1<S.ids.length?"Келесі":"Нәтиже"}</button>`}
function next(){S.i++;S.i<S.ids.length?show():end()}
function end(){
 const n=S.ids.length,pc=Math.round(S.ok/n*100);
 $(`<h1>Нәтиже</h1><div class="card"><div class="big">${pc}%</div><p class="s" style="text-align:center">Дұрыс: ${S.ok} · Қате: ${S.bad.length} · Ең ұзақ серия: ${S.best}</p>
 <div class="row"><button class="btn p" onclick="home()">Басты бет</button>${S.bad.length?`<button class="btn" onclick="S.ids=shuffle(S.bad.map(x=>x.id));S.i=0;S.ok=0;S.bad=[];S.streak=0;show()">Қателерді қайталау</button>`:""}</div></div>
 ${S.bad.length?`<div class="card"><b>Қателер</b>${S.bad.map(x=>{const q=Q[x.id],c=KEY.charCodeAt(x.id)-97;return`<div class="mi"><div>№${q.n}. ${esc(q.q)}</div><div class="x">❌ ${esc(q.o[x.k])}</div><div class="a">✅ ${esc(q.o[c])}</div></div>`}).join("")}</div>`:""}`)}
home();
</script></body></html>
